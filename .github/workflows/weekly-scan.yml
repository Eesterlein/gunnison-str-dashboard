name: Monthly STR scan

on:
  schedule:
    - cron: "0 11 15 * *"  # 15th of each month, 11:00 UTC (5 AM Mountain)
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms to scrape"
        default: "airbnb"

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape, match, rebuild dashboard data
        run: python -m pipeline.run --platforms "${{ inputs.platforms || 'airbnb' }}"

      - name: Commit new data
        run: |
          git config user.name "str-monitor-bot"
          git config user.email "str-monitor-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "STR scan $(date -u +%Y-%m-%d)"
            git push
          fi

      # GitHub emails the repo owner when a scheduled run fails. A partial scan is saved above
      # (nothing gets wrongly delisted), then this step fails the run so someone takes a look.
      - name: Alert if any source was partial or failed
        run: |
          python - <<'PY'
          import json, sys
          last = json.load(open("data/history/runs.json"))[-1]
          bad = {k: v for k, v in last["platform_status"].items() if not v.get("ok")}
          if bad:
              print(f"::error::Scan {last['date']} was partial or failed: {json.dumps(bad)}. See RUNBOOK.md.")
              sys.exit(1)
          print(f"Scan {last['date']} OK: {json.dumps(last['platform_status'])}")
          PY
